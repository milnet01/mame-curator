# Push gate for the machine-wide hook (~/.claude/githooks/pre-push), which
# .git/hooks/pre-push hands off to. It secret-scans the pushed commits, then
# runs the full CI mirror in place. dirtyTree=refuse stops a push while
# uncommitted edits exist, so the checked tree IS the pushed commit
# (local-gate.md § 2.1 item 2).
[ants "gate"]
	command = ./local-CI.sh
	inPlace = true
	dirtyTree = refuse
	# A push touching only these runs local-CI.sh --docs: the tests that read
	# Markdown plus the secret scan (mame-curator-1128). The hook never counts
	# a build file or lockfile as documentation, whatever this says.
	docsGlob = *.md|docs/*|.roadmap-counter
	docsMode = --docs

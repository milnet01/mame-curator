name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous in-progress runs of the same workflow on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (mame-curator-1122); a job that must write says so.
permissions:
  contents: read

jobs:
  lint-types-test:
    name: Lint, type-check, test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

      - name: pytest
        run: uv run pytest

      - name: API type sync (Python ↔ TS)
        run: python3 tools/check_api_types_sync.py

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  frontend-lint-types-test:
    name: Frontend lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Linux-only on purpose — the frontend pipeline (Vite, ESLint,
    # Vitest, TypeScript) is OS-agnostic; the cross-platform quirks
    # are all in the backend (Windows path semantics, macOS fsync).
    # Adding a matrix here would 3× the CI runtime for zero coverage
    # gain. See `docs/specs/DS03-dependency-freshness.md § Cluster G` for the design call.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Source-of-truth: `engines.node` in frontend/package.json
          # (Cluster E pinned this to 24.x; Cluster G reads from
          # there so a future engines bump propagates automatically.)
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Formatting gate (mame-curator-1075): `prettier --check .`; dist/ is
      # excluded by frontend/.prettierignore.
      - name: Prettier
        run: npm run format

      # Full build (`tsc -b && vite build`), not `tsc --noEmit`: the root
      # tsconfig is a solution file (files: [] + references), so
      # `tsc --noEmit` checks ZERO files. Only `tsc -b` follows the project
      # references into src/ (incl. src/test/**) — see mame-curator-1072.
      - name: Build (type-check + bundle)
        run: npm run build

      # dist/ is committed and served as-is, so this build must reproduce
      # it byte for byte (local-CI.sh runs the same check).
      - name: Committed dist matches the build
        run: test -z "$(git status --porcelain -- dist)" || { git status --short -- dist; exit 1; }

      # P06 bundle budget (mame-curator-1120): every emitted JS chunk, gzipped,
      # stays within 350 kB. Reads frontend/package.json's "size-limit" array.
      - name: Bundle size (size-limit)
        run: npm run size

      - name: Vitest
        run: npm test

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Direct binary invocation rather than gitleaks/gitleaks-action@v2.
      # The action computes a diff range as `<before>^..<after>` and breaks
      # on the first push (the first commit has no parent). Full-repo scan
      # is fast for our size and has no event-payload edge cases.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --verbose --redact --no-banner --exit-code 1

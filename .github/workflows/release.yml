name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # A manual run rehearses every build job, the desktop bundles included,
  # and publishes nothing: the publish job runs for a tag only.
  workflow_dispatch:

# Release runs are sequential per ref; never cancel a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default (mame-curator-1122); a job that must write says so.
permissions:
  contents: read

jobs:
  # Stage 1 — re-run the full CI gate at the tagged commit.
  # If any of these fail, the publish job never runs and no Release is created.
  verify-ci:
    name: Verify CI is green at tag
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache in a release build: a poisoned cache would ship.
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

      - name: pytest
        run: uv run pytest

      - name: API type sync (Python ↔ TS)
        run: python3 tools/check_api_types_sync.py

  frontend-lint-types-test:
    name: Frontend lint, type-check, test at tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Mirrors ci.yml's frontend lane (see docs/specs/DS03-dependency-freshness.md
    # § Cluster G). Release pipeline re-runs every CI gate at the
    # tagged commit before the build/publish stages fire.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          # No cache in a release build: a poisoned cache would ship.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format

      # Full build, not `tsc --noEmit` — the root tsconfig is a solution
      # file that checks zero files; only `tsc -b` (inside `npm run build`)
      # follows the references into src/. See mame-curator-1072.
      - name: Build (type-check + bundle)
        run: npm run build

      # P06 bundle budget (mame-curator-1120): every emitted JS chunk, gzipped,
      # stays within 350 kB. Reads frontend/package.json's "size-limit" array.
      - name: Bundle size (size-limit)
        run: npm run size

      - name: Vitest
        run: npm test

  gitleaks:
    name: Secret scan at tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Direct binary invocation rather than gitleaks/gitleaks-action@v2 — see
      # ci.yml for rationale (diff-range action breaks on first-push history).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/zricethezav/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --verbose --redact --no-banner --exit-code 1

  # Stage 2 — build the artifact. Only runs if every verify-ci matrix job passed.
  build:
    name: Build sdist + wheel
    needs: [verify-ci, frontend-lint-types-test, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache in a release build: a poisoned cache would ship.
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Stage 2b — the desktop bundles (mame-curator-1095). Each job runs the same
  # "stage: <name>" steps as its local script's "# stage:" lines, by calling
  # that script with --stage; tests/tools/test_release_scripts.py checks the
  # two lists agree (INV-12). No caches, for the reason the build job gives.
  build-appimage:
    name: Build Linux AppImage
    needs: [verify-ci, frontend-lint-types-test, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The build image's older glibc bounds the AppImage's floor (INV-20);
    # local-appimage.sh names the same image.
    container: python:3.13-slim-bookworm
    env:
      MC_SRC: ${{ github.workspace }}
      MC_OUT: ${{ github.workspace }}/dist
      MC_WORK: /tmp/mc-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "stage: deps"
        run: bash local-appimage.sh --stage deps
      - name: "stage: freeze"
        run: bash local-appimage.sh --stage freeze
      - name: "stage: appdir"
        run: bash local-appimage.sh --stage appdir
      - name: "stage: tool"
        run: bash local-appimage.sh --stage tool
      - name: "stage: pack"
        run: bash local-appimage.sh --stage pack
      - name: Upload the AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-linux
          path: dist/*.AppImage

  build-exe:
    name: Build Windows .exe
    needs: [verify-ci, frontend-lint-types-test, gitleaks]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        # windows-latest defaults to pwsh, which cannot run the stages.
        shell: bash
    env:
      MC_PY: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: "stage: deps"
        run: bash local-exe.sh --stage deps
      - name: "stage: freeze"
        run: bash local-exe.sh --stage freeze
      - name: "stage: pack"
        run: bash local-exe.sh --stage pack
      - name: Upload the .exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-windows
          path: dist/*.exe

  build-macos:
    name: Build macOS .dmg
    needs: [verify-ci, frontend-lint-types-test, gitleaks]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MC_PY: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: "stage: deps"
        run: bash local-macos.sh --stage deps
      - name: "stage: freeze"
        run: bash local-macos.sh --stage freeze
      - name: "stage: pack"
        run: bash local-macos.sh --stage pack
      - name: Upload the .dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-macos
          path: dist/*.dmg

  # Stage 3 — publish the GitHub Release. Only runs if build succeeded.
  publish:
    name: Publish GitHub Release
    # Every bundle job must pass: a partial set is never published (spec §4.10).
    needs: [build, build-appimage, build-exe, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # required to create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Download the Linux AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-linux
          path: dist/

      - name: Download the Windows .exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-windows
          path: dist/

      - name: Download the macOS .dmg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-macos
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Pull the section for this version out of CHANGELOG.md.
          # Falls back to GitHub's auto-generated notes if missing.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { in_section = ($0 ~ "\\["v"\\]"); next }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no-changelog-section=true" >> "$GITHUB_OUTPUT"
          fi

      # `gh` ships on the runner, so no third-party action is needed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_SECTION: ${{ steps.notes.outputs.no-changelog-section }}
        run: |
          if [ "$NO_SECTION" = "true" ]; then
            notes=(--generate-notes)
          else
            notes=(--notes-file release-notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --verify-tag "${notes[@]}"
